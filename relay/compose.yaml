services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    container_name: remodex-relay
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9820:9820"
    environment:
      REMODEX_DATABASE: /data/remodex.sqlite
      REMODEX_MASTER_KEY_FILE: /run/secrets/remodex_master_key
      REMODEX_SETUP_TOKEN_FILE: /run/secrets/remodex_setup_token
    volumes:
      - remodex-control-data:/data
      - ./secrets/master-key:/run/secrets/remodex_master_key:ro
      - ./secrets/setup-token:/run/secrets/remodex_setup_token:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:9820/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  remodex-control-data:
