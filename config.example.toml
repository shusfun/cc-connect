# CC-Connect Codex Desktop App 专用配置
#
# Codex Desktop App 是项目、任务、Turn 与写入的唯一所有者。
# CC-Connect 只注册 codexapp、飞书和内部 Web management transport。
# 旧 Agent、Lark、微信、Provider、Cron、Bridge、Webhook 等配置不兼容，
# 启动时会返回明确错误；请人工删除，不会自动迁移或静默降级。

[log]
level = "info"

# server 进程只需要一个内部 Runtime 项目。Web 项目列表来自在线 Runtime
# 对 Codex Desktop App list_projects 的实时结果，不要在这里复制 Codex 项目。
[[projects]]
name = "codex-runtime"

[projects.agent]
type = "codexapp"

# 飞书是唯一支持的外部消息渠道；不需要时可省略整个 platform 段。
[[projects.platforms]]
type = "feishu"

[projects.platforms.options]
app_id = "${FEISHU_APP_ID}"
app_secret = "${FEISHU_APP_SECRET}"
# allow_from = "ou_xxx"
