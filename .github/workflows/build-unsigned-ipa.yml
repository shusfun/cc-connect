name: Build Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned release IPA
    runs-on: macos-26
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify localization sources
        run: node CodexMobile/scripts/check-localization.cjs

      - name: Select iOS 26 simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/remodex-simulators.json"
          node -e 'const fs=require("fs"),list=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/remodex-simulators.json"));const device=Object.entries(list.devices).filter(([runtime])=>runtime.includes("iOS-26")).flatMap(([,devices])=>devices).find(d=>d.name.startsWith("iPhone"));if(!device)throw Error("iOS 26 iPhone simulator required");fs.appendFileSync(process.env.GITHUB_OUTPUT,"id="+device.udid+"\n")'

      - name: Run iOS unit and real-page localization UI tests
        run: |
          set -euo pipefail
          xcodebuild -project CodexMobile/CodexMobile.xcodeproj -scheme CodexMobile -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/remodex-ios-tests.xcresult" \
            test CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/remodex-ios-tests.log"

      - name: Export simulator screenshots and test summary
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/remodex-ios-tests.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/remodex-ios-tests.xcresult" --output-path "$RUNNER_TEMP/remodex-ios-screenshots"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/remodex-ios-tests.xcresult" > "$RUNNER_TEMP/remodex-ios-summary.json"
          fi

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remodex-ios-test-evidence
          path: |
            ${{ runner.temp }}/remodex-ios-tests.xcresult
            ${{ runner.temp }}/remodex-ios-tests.log
            ${{ runner.temp }}/remodex-ios-screenshots
            ${{ runner.temp }}/remodex-ios-summary.json
          if-no-files-found: warn

      - name: Build unsigned IPA
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/build/unsigned-ipa"
          archive_path="$output_dir/CodexMobile.xcarchive"
          release_version="$(node -p 'require("./package.json").version')"
          ipa_path="$output_dir/Remodex-$release_version-unsigned.ipa"
          build_log_path="$output_dir/xcodebuild.log"

          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          xcodebuild \
            -quiet \
            -project "$GITHUB_WORKSPACE/CodexMobile/CodexMobile.xcodeproj" \
            -scheme CodexMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            archive \
            MARKETING_VERSION="${release_version%%-*}" \
            CURRENT_PROJECT_VERSION="$(node -p 'require("./package.json").iosBuildNumber')" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$build_log_path"

          app_path="$(find "$archive_path/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Unable to locate an .app bundle in $archive_path" >&2
            exit 1
          fi

          payload_root="$(mktemp -d "$output_dir/payload.XXXXXX")"
          trap 'rm -rf "$payload_root"' EXIT

          mkdir -p "$payload_root/Payload"
          ditto "$app_path" "$payload_root/Payload/$(basename "$app_path")"
          /usr/libexec/PlistBuddy -c "Add :RemodexSourceSHA string $GITHUB_SHA" "$payload_root/Payload/$(basename "$app_path")/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :RemodexReleaseVersion string $release_version" "$payload_root/Payload/$(basename "$app_path")/Info.plist"
          node CodexMobile/scripts/verify-ios-localization.cjs "$payload_root/Payload/$(basename "$app_path")"
          ditto -c -k --sequesterRsrc --keepParent "$payload_root/Payload" "$ipa_path"

          echo "Unsigned IPA created at $ipa_path"

      - name: Upload Xcode build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: remodex-unsigned-ipa-build-log
          path: build/unsigned-ipa/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: remodex-unsigned-ipa
          path: build/unsigned-ipa/*.ipa
          if-no-files-found: error
          compression-level: 0
          archive: false
