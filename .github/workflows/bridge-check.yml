name: Node Package Tests

on:
  push:
    paths:
      - ".github/workflows/bridge-check.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "phodex-bridge/**"
      - "relay/**"
  pull_request:
    paths:
      - ".github/workflows/bridge-check.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "phodex-bridge/**"
      - "relay/**"

jobs:
  bridge-check:
    name: Bridge tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.6.0

      - name: Setup pnpm
        run: |
          export COREPACK_NPM_REGISTRY=https://registry.npmmirror.com
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Resolve pnpm cache
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-26.6.0-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-26.6.0-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify bridge entrypoints load
        working-directory: phodex-bridge
        run: |
          node -e "const mod = require('./src'); const names = ['startBridge', 'openLastActiveThread', 'watchThreadRollout']; for (const name of names) { if (typeof mod[name] !== 'function') { throw new Error('Missing export: ' + name); } }"

      - name: Run bridge tests
        run: pnpm --filter remodex test

  relay-check:
    name: Relay tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.6.0

      - name: Setup pnpm
        run: |
          export COREPACK_NPM_REGISTRY=https://registry.npmmirror.com
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Resolve pnpm cache
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-26.6.0-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-26.6.0-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run relay tests
        run: pnpm --filter remodex-relay test
