<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CC-Connect 状态</title>
  <script src="/wails/runtime.js" type="module"></script>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: transparent; }
    * { box-sizing: border-box; letter-spacing: 0; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: light-dark(#202124, #f2f3f5); background: light-dark(rgba(248,249,250,.98), rgba(30,31,34,.98)); }
    button, input { font: inherit; }
    main { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 18px 18px 12px; display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
    h1 { margin: 0; font-size: 15px; font-weight: 650; }
    .state { display: flex; align-items: center; gap: 7px; font-size: 12px; color: light-dark(#5f6368, #aeb2b8); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa0a6; }
    .dot.online { background: #1f9d55; }
    .dot.pending { background: #d97706; }
    .content { min-height: 0; flex: 1; overflow-y: auto; padding: 0 18px 18px; }
    section { border-top: 1px solid light-dark(#dfe1e5, #44474d); padding: 12px 0; }
    .row { min-height: 30px; display: grid; grid-template-columns: 120px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 12px; }
    .label { color: light-dark(#70757a, #aeb2b8); }
    .value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
    .error { margin: 8px 0 0; padding: 10px; border-left: 3px solid #d93025; background: light-dark(#fce8e6, #4a2625); font-size: 12px; line-height: 1.45; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    button { min-height: 32px; border: 1px solid light-dark(#dadce0, #52555b); border-radius: 6px; background: light-dark(#fff, #383a3f); color: inherit; cursor: pointer; }
    button:hover { background: light-dark(#f1f3f4, #44474d); }
    button.primary { border-color: #1677ff; background: #1677ff; color: #fff; }
    .pair { display: none; grid-template-columns: 1fr; gap: 8px; }
    .pair.visible { display: grid; }
    input { width: 100%; min-height: 34px; padding: 0 10px; border: 1px solid light-dark(#dadce0, #52555b); border-radius: 5px; background: light-dark(#fff, #2b2d31); color: inherit; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .switch input { width: 36px; min-height: auto; }
    .muted { color: light-dark(#70757a, #aeb2b8); font-size: 11px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>CC-Connect</h1>
    <div class="state"><span id="dot" class="dot"></span><span id="stateText">正在读取</span></div>
  </header>
  <div class="content">
    <section id="runtimeRows"></section>
    <section id="messageSection" hidden><div id="message" class="error"></div></section>
    <section class="actions">
      <button id="console">打开控制台</button>
      <button id="reconnect" title="从 Codex 终端恢复连接">恢复连接</button>
      <button id="logs">查看日志</button>
      <button id="updates">检查更新</button>
    </section>
    <section>
      <label class="switch"><span>登录时启动</span><input id="autostart" type="checkbox"></label>
    </section>
    <section id="pair" class="pair">
      <input id="server" type="url" placeholder="Control HTTPS 地址" autocomplete="url">
      <input id="code" type="text" placeholder="配对码" autocomplete="one-time-code">
      <input id="name" type="text" placeholder="设备名称" autocomplete="off">
      <button id="pairButton" class="primary">配对设备</button>
    </section>
  </div>
</main>
<script type="module">
  const call = (method, ...args) => globalThis.wails.Call.ByName(`main.CompanionService.${method}`, ...args);
  const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
  let current = null;
  function showMessage(message) {
    const section = document.querySelector("#messageSection");
    section.hidden = !message;
    document.querySelector("#message").textContent = message || "";
  }
  function render(status) {
    current = status;
    const connected = status.online && status.supervisor.runtime_connected;
    const pending = status.online && status.supervisor.worker_running && !connected;
    document.querySelector("#dot").className = `dot ${connected ? "online" : pending ? "pending" : ""}`;
    document.querySelector("#stateText").textContent = connected ? "已连接" : pending ? "正在连接" : "离线";
    const rows = [
      ["Control", status.control_url || "未配对"],
      ["设备", status.device_id || "-"],
      ["Supervisor", status.online ? `PID ${status.supervisor.supervisor_pid}` : "离线"],
      ["Worker 代际", status.online ? `${status.supervisor.worker_generation} / PID ${status.supervisor.worker_pid || "-"}` : "-"],
      ["连接代际", status.supervisor.connection_generation || "-"],
      ["Runtime", status.supervisor.version || status.release.active_tag || "-"],
      ["Desktop", status.desktop_version]
    ];
    document.querySelector("#runtimeRows").innerHTML = rows.map(([label, value]) => `<div class="row"><span class="label">${escapeHTML(label)}</span><span class="value" title="${escapeHTML(value)}">${escapeHTML(value)}</span></div>`).join("");
    document.querySelector("#autostart").checked = status.autostart;
    document.querySelector("#pair").classList.toggle("visible", !status.device_id);
    showMessage(status.status_message || status.supervisor.last_error || status.release_error || status.autostart_error || "");
  }
  async function refresh() {
    try { render(await call("Status")); } catch (error) { showMessage(String(error)); }
  }
  document.querySelector("#console").onclick = async () => { try { await call("OpenConsole"); } catch (error) { showMessage(String(error)); } };
  document.querySelector("#reconnect").onclick = async () => { try { await call("Reconnect"); await refresh(); } catch (error) { showMessage(String(error)); } };
  document.querySelector("#logs").onclick = async () => { try { await call("OpenLogs"); } catch (error) { showMessage(String(error)); } };
	document.querySelector("#updates").onclick = async () => {
		try {
			const update = await call("CheckUpdate");
			if (!update.available) { showMessage(`CC-Connect ${update.current_tag} 已是最新版本`); return; }
			showMessage(`正在下载 CC-Connect ${update.latest_tag}...`);
			await call("DownloadUpdate", update.latest_tag);
			showMessage(`CC-Connect ${update.latest_tag} 已完成签名校验`);
		} catch (error) { showMessage(String(error)); }
	};
  document.querySelector("#autostart").onchange = async event => { try { await call("SetAutostart", event.target.checked); } catch (error) { event.target.checked = !event.target.checked; showMessage(String(error)); } };
  document.querySelector("#pairButton").onclick = async () => {
    try {
      await call("Pair", document.querySelector("#server").value, document.querySelector("#code").value, document.querySelector("#name").value || "Mac");
      await refresh();
    } catch (error) { showMessage(String(error)); }
  };
  globalThis.wails.Events.On("runtime-status", event => render(event.data));
  globalThis.wails.Events.On("check-updates", refresh);
  refresh();
</script>
</body>
</html>
